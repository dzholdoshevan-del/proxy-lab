global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns 127.0.0.11:53

frontend web
    bind :8080
    default_backend apps

backend apps
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health
    default-server check inter 2s fall 2 rise 2 resolvers docker init-addr none
    server app1 app1:80
    server app2 app2:80
    server app3 app3:80

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s